<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Judge Results Report</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#61708a;--line:#dce3ee;--panel:#fff;--bg:#f4f7fb;--accent:#2855c5;--danger:#b42318;--warn:#9a6700;--success:#16794c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1380px;margin:0 auto;padding:36px 24px 56px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 8px}h2{font-size:21px;margin:0 0 16px}p{margin:5px 0}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.subtitle{color:var(--muted)}.badge{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px rgba(23,32,51,.04)}.card{padding:18px}.card .value{display:block;font-size:28px;font-weight:800;margin-top:4px}.card .label{color:var(--muted);font-size:13px}.accent{color:var(--accent)}.danger{color:var(--danger)}.success{color:var(--success)}.warn{color:var(--warn)}.section{padding:22px;margin-top:20px}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:14px;background:#f8faff;border-radius:10px;border:1px solid #e6ebf5}.metric strong{display:block;font-size:20px}.metric span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:13px 12px}th{background:#f8faff;color:#53617a;font-size:12px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0}tr:last-child td{border-bottom:0}.case-id{font-weight:800;color:var(--accent)}.status{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap}.status.fail{background:#fff0ef;color:var(--danger)}.status.unknown{background:#fff8e6;color:var(--warn)}.status.pass{background:#eaf8f1;color:var(--success)}.answer{max-width:280px;white-space:pre-wrap;overflow-wrap:anywhere}.ids{max-width:270px;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.ids summary{cursor:pointer;color:var(--accent);font-family:inherit;margin-bottom:5px}.reason{color:#3c4a62;max-width:350px}.source{font-size:12px;color:var(--muted);margin-top:28px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;color:var(--ink);cursor:pointer}.filters button.active,.filters button:hover{background:#edf3ff;border-color:#9bb2eb;color:var(--accent)}@media(max-width:850px){main{padding:24px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-grid{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:16px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Evaluation report</div><h1>LLM Judge Results</h1><p class="subtitle">A case-by-case review of candidate answers against the golden set.</p></div><div class="badge" id="mode"></div></header>
<section class="grid" id="summary"></section>
<section class="section"><h2>Evaluation metrics</h2><div class="metric-grid" id="metrics"></div></section>
<section class="section"><h2>Case results</h2><div class="filters"><button class="active" data-filter="all">All cases</button><button data-filter="fail">Failures</button><button data-filter="unknown">Unknown verdicts</button></div><div class="table-wrap"><table><thead><tr><th>Case</th><th>Question</th><th>Expected answer</th><th>Candidate answer</th><th>Verdict</th><th>Evidence and reason</th><th>Record IDs</th></tr></thead><tbody id="cases"></tbody></table></div></section>
<p class="source">Source: <span id="golden"></span> · Values and wording are preserved from the supplied JSON snapshot.</p>
</main>
<script>

,"judge_evidence":"unknown","judge_reason":"The candidate answer does not provide the lowest contract price, so it cannot be confirmed against the golden answer (€4125,00)."},{"case_id":"6","question":"What is the average contract price?","expected_answer":"€29559,26","candidate_answer":"unknown","candidate_record_ids":[],"deterministic_status":"fail","judge_verdict":"UNKNOWN","judge_evidence":"unknown","judge_reason":"The candidate answer does not provide the average contract price, so it cannot be verified against the golden answer (€29559,26)."},{"case_id":"7","question":"What is the most common procedure type?","expected_answer":"Ajuste Direto Regime Geral","candidate_answer":"unknown","candidate_record_ids":[],"deterministic_status":"fail","judge_verdict":"UNKNOWN","judge_evidence":"unknown","judge_reason":"The candidate answer does not provide the procedure type, so it cannot be verified against the golden answer."},{"case_id":"8","question":"How many contracts used that procedure type (direct award)?","expected_answer":"116","candidate_answer":"0","candidate_record_ids":[],"deterministic_status":"fail","judge_verdict":"FAIL","judge_evidence":"“0”","judge_reason":"The candidate answer states 0 contracts, but the golden answer is 116 for the procedure type (direct award)."},{"case_id":"9","question":"How many contracts are for “Aquisição de bens móveis” (goods)?","expected_answer":"30","candidate_answer":"145","candidate_record_ids":["contrato-0001","contrato-0002","contrato-0003","contrato-0004","contrato-0005","contrato-0006","contrato-0007","contrato-0008","contrato-0009","contrato-0010","contrato-0011","contrato-0012","contrato-0013","contrato-0014","contrato-0015","contrato-0016","contrato-0017","contrato-0018","contrato-0019","contrato-0020","contrato-0021","contrato-0022","contrato-0023","contrato-0024","contrato-0025","contrato-0026","contrato-0027","contrato-0028","contrato-0029","contrato-0030","contrato-0031","contrato-0032","contrato-0033","contrato ting authority appears most often?","expected_answer":"Município de Lisboa (10 contracts)","candidate_answer":"unknown","candidate_record_ids":[],"deterministic_status":"fail","judge_verdict":"UNKNOWN","judge_evidence":"unknown","judge_reason":"The candidate answer does not provide which contracting authority appears most often, so it cannot be verified against the golden answer."},{"case_id":"11","question":"Qual a soma de contratos atribuidos à FBCPS, por ajuste direto pela Carris?","expected_answer":"95257,83€","candidate_answer":"110267.83","candidate_record_ids":["contrato-0097","contrato-0108"],"deterministic_status":"fail","judge_verdict":"FAIL","judge_evidence":"110267.83","judge_reason":"A resposta do candidato (110267.83) não coincide com a soma indicada no gabarito (95257,83€)."},{"case_id":"12","question":"Qual o total contratado, agrupado por entidade adjudicatária","expected_answer":"#VALUE!","candidate_answer":"FBCPS - Business Consulting and Professional Services, Ld.ª (510174132): 106380","candidate_record_ids":["contrato-0089","contrato-0092","contrato-0098","contrato-0114","contrato-0134"],"deterministic_status":"unknown","judge_verdict":"UNKNOWN","judge_evidence":"FBCPS - Business Consulting and Professional Services, Ld.ª (510174132): 106380","judge_reason":"A resposta dourada é #VALUE!, pelo que não é possível determinar se o total contratado por entidade adjudicatária está correto."},{"case_id":"13","question":"Qual o total de contratos feitos, agrupado por entidade?","expected_answer":"#VALUE!","candidate_answer":"Agência para a Modernização Administrativa, I. P.: 1 contrato; Município de Lagos: 2 contratos; Município de Lisboa: 1 contrato; EPAL - Empresa Portuguesa das Águas Livres, S. A.: 1 contrato.","candidate_record_ids":["contrato-0089","contrato-0092","contrato-0098","contrato-0114","contrato-0134"],"deterministic_status":"unknown","judge_verdict":"UNKNOWN","judge_evidence":"“Agência para a Modernização Administrativa, I. P.: 1 contrat const metrics = report.metrics;
const pct = value => (value * 100).toFixed(1).replace(/\.0$/, '') + '%';
document.getElementById('mode').textContent = report.mode;
document.getElementById('golden').textContent = report.golden_set;
document.getElementById('summary').innerHTML = [
  ['Cases', metrics.cases, 'accent'], ['Scorable cases', metrics.scorable_cases, 'accent'], ['Answer pass rate', pct(metrics.answer_pass_rate), 'danger'], ['Accuracy', pct(metrics.accuracy), 'success']
].map(([label,value,klass]) => '<div class="card"><span class="label">'+label+'</span><span class="value '+klass+'">'+value+'</span></div>').join('');
document.getElementById('metrics').innerHTML = [
  ['Unknown cases', metrics.unknown_cases], ['Judge unknown cases', metrics.judge_unknown_cases], ['True positives', metrics.true_positive], ['True negatives', metrics.true_negative], ['False positives', metrics.false_positive], ['False negatives', metrics.false_negative], ['Precision', pct(metrics.precision)], ['Recall', pct(metrics.recall)], ['Deterministic pass rate', pct(report.cases.filter(c => c.deterministic_status === 'pass').length / report.cases.length)]
].map(([label,value]) => '<div class="metric"><strong>'+value+'</strong><span>'+label+'</span></div>').join('');
const esc = value => String(value ?? 'unknown').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function render(filter='all') {
  document.getElementById('cases').innerHTML = report.cases.filter(c => filter === 'all' || c.judge_verdict.toLowerCase() === filter).map(c => {
    const verdict = c.judge_verdict.toLowerCase();
    const ids = c.candidate_record_ids || [];
    return '<tr><td><span class="case-id">#'+esc(c.case_id)+'</span><br><small>'+esc(c.deterministic_status)+'</small></td><td>'+esc(c.question)+'</td><td class="answer">'+esc(c.expected_answer)+'</td><td class="answer">'+esc(c.candidate_answer)+'</td><td><span class="status '+(verdict === 'fail' ? 'fail' : verdict === 'unknown' ? 'unknown' : 'pass')+'">'+esc(c.judge_verdict)+'</span></td><td class="reason"><strong>Evidence:</strong> '+esc(c.judge_evidence)+'<br><strong>Reason:</strong> '+esc(c.judge_reason)+'</td><td class="ids">'+(ids.length ? '<details><summary>'+ids.length+' record ID'+(ids.length === 1 ? '' : 's')+'</summary>'+ids.map(esc).join('<br>')+'</details>' : 'None')+'</td></tr>';
  }).join('');
}
document.querySelectorAll('.filters button').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active')); button.classList.add('active'); render(button.dataset.filter); }));
render();
</script>
</body>
</html>
